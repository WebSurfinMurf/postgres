version: '3.8'

networks:
  postgres-net:
    external: true
  # Dedicated per-consumer DB network (isolation: the app sees only postgres, not other DB listeners)
  dotapicker-model-db-net:
    external: true

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: unless-stopped
    networks:
      - postgres-net
      - dotapicker-model-db-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-defaultdb}
    volumes:
      - /home/administrator/projects/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-defaultdb}"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "hidden=true"
